<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kandidat Admin | E-Voting</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b100d;
      color: #ffffff;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      width: 240px;
      height: 100vh;
      padding: 28px 20px;
      background: #101713;
      border-right: 1px solid #28322b;
    }

    .brand {
      margin-bottom: 40px;
    }

    .brand h2 {
      margin-bottom: 5px;
    }

    .brand span {
      color: #75b986;
      font-size: 13px;
    }

    .nav a {
      display: block;
      padding: 13px 14px;
      margin-bottom: 8px;
      border-radius: 9px;
      color: #b8c1bb;
      text-decoration: none;
    }

    .nav a.active {
      background: #245f37;
      color: white;
    }

    .main {
      margin-left: 240px;
      padding: 34px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .topbar p {
      color: #aab3ad;
      margin-top: 6px;
    }

    #logoutButton {
      background: transparent;
      color: white;
      border: 1px solid #445048;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    #candidateMessage {
      display: none;
      margin-bottom: 20px;
      padding: 14px;
      background: rgba(180, 50, 50, 0.15);
      border: 1px solid #753b3b;
      border-radius: 9px;
      color: #ffb2b2;
    }

    .candidate-list {
      display: grid;
      gap: 22px;
    }

    .candidate-card {
      background: #121a15;
      border: 1px solid #29362e;
      border-radius: 16px;
      padding: 24px;
    }

    .candidate-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 22px;
    }

    .candidate-number {
      color: #d8b95b;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .candidate-name {
      font-size: 26px;
      margin-bottom: 7px;
    }

    .candidate-class {
      color: #aeb7b1;
    }

    .status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    .status.active {
      background: rgba(65, 165, 90, 0.16);
      color: #8ee0a2;
      border: 1px solid rgba(80, 180, 105, 0.4);
    }

    .status.inactive {
      background: rgba(180, 60, 60, 0.15);
      color: #ffaaaa;
      border: 1px solid rgba(200, 80, 80, 0.4);
    }

    .candidate-content {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .info-box {
      background: #0d140f;
      border: 1px solid #263129;
      border-radius: 12px;
      padding: 18px;
    }

    .info-box h3 {
      color: #80c691;
      margin-bottom: 13px;
      font-size: 16px;
    }

    .info-box p,
    .info-box li {
      color: #d8ded9;
      line-height: 1.6;
    }

    .info-box ul {
      padding-left: 20px;
    }

    .info-box li {
      margin-bottom: 8px;
    }

    .program {
      margin-bottom: 14px;
    }

    .program:last-child {
      margin-bottom: 0;
    }

    .program strong {
      display: block;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .program p {
      color: #aeb7b1;
      font-size: 14px;
    }

    @media (max-width: 1000px) {
      .candidate-content {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
      }

      .main {
        margin-left: 0;
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="brand">
      <h2>E-Voting</h2>
      <span>ADMINISTRATOR</span>
    </div>

    <nav class="nav">
      <a href="/admin-dashboard.html">
        Dashboard
      </a>

      <a href="/admin-statistics.html">
        Statistik
      </a>

      <a
        href="/admin-candidates.html"
        class="active"
      >
        Kandidat
      </a>

      <a href="/admin-voters.html">
        Pemilih
      </a>

      <a href="/admin-results.html">
        Hasil
      </a>
    </nav>

  </aside>

  <main class="main">

    <header class="topbar">

      <div>
        <h1>Kandidat</h1>

        <p>
          Data kandidat pemilihan
        </p>
      </div>

      <button id="logoutButton">
        Keluar
      </button>

    </header>

    <div id="candidateMessage"></div>

    <section
      id="candidateList"
      class="candidate-list"
    >
      Memuat data kandidat...
    </section>

  </main>

  <script
    type="module"
    src="/src/js/admin-candidates.js"
  ></script>

</body>
</html>
