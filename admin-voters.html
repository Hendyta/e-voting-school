<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pemilih Admin | E-Voting</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b100d;
      color: #ffffff;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      width: 240px;
      height: 100vh;
      padding: 28px 20px;
      background: #101713;
      border-right: 1px solid #28322b;
    }

    .brand {
      margin-bottom: 40px;
    }

    .brand h2 {
      margin-bottom: 5px;
    }

    .brand span {
      color: #75b986;
      font-size: 13px;
    }

    .nav a {
      display: block;
      padding: 13px 14px;
      margin-bottom: 8px;
      border-radius: 9px;
      color: #b8c1bb;
      text-decoration: none;
    }

    .nav a.active {
      background: #245f37;
      color: white;
    }

    .main {
      margin-left: 240px;
      padding: 34px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .topbar p {
      color: #aab3ad;
      margin-top: 6px;
    }

    #logoutButton {
      background: transparent;
      color: white;
      border: 1px solid #445048;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .summary {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: #121a15;
      border: 1px solid #29362e;
      border-radius: 14px;
      padding: 20px;
    }

    .card p {
      color: #aeb7b1;
      font-size: 13px;
      margin-bottom: 9px;
    }

    .card h2 {
      font-size: 28px;
    }

    .section {
      background: #121a15;
      border: 1px solid #29362e;
      border-radius: 14px;
      padding: 22px;
      overflow-x: auto;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .section-header p {
      color: #aeb7b1;
      font-size: 13px;
      margin-top: 5px;
    }

    #searchInput {
      width: 260px;
      padding: 11px 13px;
      background: #0d140f;
      border: 1px solid #354239;
      border-radius: 9px;
      color: white;
      outline: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #29332c;
    }

    th {
      color: #83ca94;
      font-size: 13px;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge.success {
      color: #91e5a6;
      background: rgba(50, 150, 75, 0.15);
    }

    .badge.waiting {
      color: #e6ca78;
      background: rgba(180, 145, 50, 0.15);
    }

    .badge.active {
      color: #91e5a6;
      background: rgba(50, 150, 75, 0.15);
    }

    .badge.inactive {
      color: #ffaaaa;
      background: rgba(180, 50, 50, 0.15);
    }

    #voterMessage {
      display: none;
      margin-bottom: 20px;
      padding: 14px;
      background: rgba(180, 50, 50, 0.15);
      border: 1px solid #753b3b;
      border-radius: 9px;
      color: #ffb2b2;
    }

    @media (max-width: 900px) {
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
      }

      .main {
        margin-left: 0;
        padding: 22px;
      }

      .summary {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 550px) {
      .summary {
        grid-template-columns: 1fr;
      }

      .section-header {
        display: block;
      }

      #searchInput {
        width: 100%;
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="brand">
      <h2>E-Voting</h2>
      <span>ADMINISTRATOR</span>
    </div>

    <nav class="nav">

      <a href="/admin-dashboard.html">
        Dashboard
      </a>

      <a href="/admin-statistics.html">
        Statistik
      </a>

      <a href="/admin-candidates.html">
        Kandidat
      </a>

      <a
        href="/admin-voters.html"
        class="active"
      >
        Pemilih
      </a>

      <a href="/admin-results.html">
        Hasil
      </a>

    </nav>

  </aside>

  <main class="main">

    <header class="topbar">

      <div>
        <h1>Pemilih</h1>
        <p>Monitoring status pemilih</p>
      </div>

      <button id="logoutButton">
        Keluar
      </button>

    </header>

    <div id="voterMessage"></div>

    <section class="summary">

      <article class="card">
        <p>Total Pemilih</p>
        <h2 id="totalVoters">-</h2>
      </article>

      <article class="card">
        <p>Sudah Memilih</p>
        <h2 id="totalVoted">-</h2>
      </article>

      <article class="card">
        <p>Belum Memilih</p>
        <h2 id="totalNotVoted">-</h2>
      </article>

      <article class="card">
        <p>Pemilih Aktif</p>
        <h2 id="totalActive">-</h2>
      </article>

    </section>

    <section class="section">

      <div class="section-header">

        <div>
          <h2>Daftar Pemilih</h2>
          <p>
            Tidak menampilkan kode akses
            maupun pilihan kandidat.
          </p>
        </div>

        <input
          type="search"
          id="searchInput"
          placeholder="Cari kelas atau kategori..."
        >

      </div>

      <table>

        <thead>
          <tr>
            <th>No.</th>
            <th>Peran</th>
            <th>Kelas</th>
            <th>Gender</th>
            <th>Status Voting</th>
            <th>Status Akun</th>
          </tr>
        </thead>

        <tbody id="voterTable"></tbody>

      </table>

    </section>

  </main>

  <script
    type="module"
    src="/src/js/admin-voters.js"
  ></script>

</body>
</html>
