<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login Admin | E-Voting</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(
          135deg,
          #07130d,
          #10271a,
          #17160d
        );
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #ffffff;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: rgba(20, 24, 21, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 20px;
      padding: 38px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .admin-badge {
      display: inline-block;
      background: #d8b95b;
      color: #101510;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #b9c1bc;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #465048;
      border-radius: 10px;
      background: #111713;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #69b879;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      margin-top: 8px;
      background: #2f8b4b;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #27773f;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.4;
    }

    #message.error {
      display: block;
      background: rgba(185, 48, 48, 0.15);
      border: 1px solid rgba(220, 80, 80, 0.4);
      color: #ffaaaa;
    }

    #message.success {
      display: block;
      background: rgba(47, 139, 75, 0.15);
      border: 1px solid rgba(80, 180, 105, 0.4);
      color: #a9e6b7;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #b9c1bc;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      color: white;
    }
  </style>
</head>

<body>

  <main class="login-container">

    <section class="login-card">

      <div class="admin-badge">
        ADMINISTRATOR
      </div>

      <h1>Login Admin</h1>

      <p class="subtitle">
        Masuk menggunakan akun administrator
        untuk mengelola dan memantau e-voting.
      </p>

      <form id="adminLoginForm">

        <div class="form-group">
          <label for="email">
            Email Admin
          </label>

          <input
            type="email"
            id="email"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          type="submit"
          id="loginButton"
        >
          MASUK ADMIN
        </button>

      </form>

      <div id="message"></div>

    </section>

    <a
      href="/"
      class="back-link"
    >
      ← Kembali ke halaman pemilih
    </a>

  </main>

  <script
    type="module"
    src="/src/js/admin-login.js"
  ></script>

</body>
</html>
