<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Voting Berhasil | E-Voting Sekolah</title>

  <link
    rel="stylesheet"
    href="/src/css/style.css"
  >
</head>


<body class="success-page">

  <main class="success-main">

    <section class="success-card">

      <div class="success-icon">
        ✓
      </div>


      <p class="success-label">
        VOTING BERHASIL
      </p>


      <h1>
        Terima Kasih
      </h1>


      <p class="success-description">
        Suara Anda telah berhasil disimpan.
        Proses voting telah selesai.
      </p>


      <div class="success-information">

        <strong>
          Suara telah diverifikasi
        </strong>

        <p>
          Kode voting yang telah digunakan
          tidak dapat digunakan untuk memilih kembali.
        </p>

      </div>


      <p
        id="successMessage"
        class="success-message"
        aria-live="polite"
      >
        Mengakhiri sesi voting...
      </p>


      <button
        id="returnLoginButton"
        class="primary-action-button success-button"
        type="button"
        disabled
      >
        KEMBALI KE LOGIN
      </button>

    </section>

  </main>


  <script
    type="module"
    src="/src/js/success.js"
  ></script>

</body>

</html>
